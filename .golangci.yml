version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - goconst
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - nakedret
    - prealloc
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    errcheck:
      check-blank: true
    goconst:
      min-occurrences: 4
    govet:
      enable:
        - shadow
    gocyclo:
      min-complexity: 20
    nakedret:
      max-func-lines: 50
    staticcheck:
      checks:
        - "all"
        - "-SA6000"
        - "-SA2002"
        - "-QF1001"
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - goconst
          - gocyclo
          - prealloc
          - unparam
      - path: (.+)\.go$
        text: "always receives"
      - path: (.+)\.go$
        text: "parameter .* is always"
    paths:
      - bin
      - \.git
      - vendor

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
